name: medihub
description: "MediHub - Healthcare Appointment System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Supabase (replaces Firebase)
  supabase_flutter: ^2.5.0

  # Maps (OpenStreetMap - free)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location / GPS
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.3.0

  # UI & Icons
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1

  # File & Image
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path: ^1.9.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3

  # Splash & Icons
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png
    - assets/images/

flutter_native_splash:
  color: "#0B5EFF"
  image: assets/logo.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
